<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RealmForge v3</title>
<style>
:root{--bg:#0c1117;--panel:#141c24;--panel2:#1b2631;--text:#eef3f6;--muted:#9aaab7;--border:#2b3946;--accent:#d2aa62;--input:#0d151d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:1440px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 12px;font-weight:650;cursor:pointer}
button.primary{background:var(--accent);color:#181208;border-color:var(--accent)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:12px}.panel,.mapbox{border:1px solid var(--border);border-radius:12px;background:var(--panel)}
.panel{padding:14px}.section{padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--border)}.section:last-child{border:0;margin:0}
.section h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 8px;color:#dbe4eb}
label{display:block;margin:8px 0 4px}input[type=text],select{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px}
.slider{display:grid;grid-template-columns:1fr 45px;gap:8px;align-items:center}input[type=range]{width:100%;accent-color:var(--accent)}.v{text-align:right;color:var(--muted);font-size:12px}
.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check label{margin:0}.mapbox{padding:9px;background:#091016;min-width:0}
canvas{display:block;width:100%;height:auto;border-radius:7px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}.pill{border:1px solid var(--border);border-radius:99px;padding:4px 8px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div class="top"><div><h1>RealmForge v3</h1><div class="sub">Procedural illustrated fantasy worlds — smooth terrain, biomes, routed roads, varied symbols.</div></div>
<div class="actions"><button id="random">Random Seed</button><button id="gen" class="primary">Generate Map</button><button id="export">Export PNG</button></div></div>
<div class="layout"><aside class="panel">
<div class="section"><h2>World</h2><label>Seed</label><input id="seed" value="REALM-001"><label>Style</label><select id="style"><option value="parchment">Parchment Atlas</option><option value="verdant">Verdant Atlas</option><option value="night">Night Chart</option></select>
<label>Sea level</label><div class="slider"><input id="sea" type="range" min="38" max="62" value="49"><span id="seaV" class="v"></span></div>
<label>Coast complexity</label><div class="slider"><input id="rough" type="range" min="2" max="9" value="6"><span id="roughV" class="v"></span></div></div>
<div class="section"><h2>Terrain</h2>
<label>Mountains</label><div class="slider"><input id="mount" type="range" min="0" max="100" value="52"><span id="mountV" class="v"></span></div>
<label>Forests</label><div class="slider"><input id="forest" type="range" min="0" max="100" value="52"><span id="forestV" class="v"></span></div>
<label>Drylands</label><div class="slider"><input id="dry" type="range" min="0" max="100" value="28"><span id="dryV" class="v"></span></div>
<label>Rivers</label><div class="slider"><input id="river" type="range" min="0" max="100" value="48"><span id="riverV" class="v"></span></div></div>
<div class="section"><h2>Civilization</h2>
<label>Settlements</label><div class="slider"><input id="towns" type="range" min="0" max="100" value="48"><span id="townsV" class="v"></span></div>
<label>Roads</label><div class="slider"><input id="roads" type="range" min="0" max="100" value="55"><span id="roadsV" class="v"></span></div>
<div class="check"><input id="labels" type="checkbox" checked><label for="labels">Place labels</label></div>
<div class="check"><input id="contours" type="checkbox" checked><label for="contours">Coastline ink</label></div>
<div class="check"><input id="border" type="checkbox" checked><label for="border">Decorative border</label></div></div>
</aside><main class="mapbox"><canvas id="map" width="1400" height="900"></canvas><div id="meta" class="meta"></div></main></div></div>
<script>
const $=id=>document.getElementById(id),C=$('map'),ctx=C.getContext('2d'),W=C.width,H=C.height;
['sea','rough','mount','forest','dry','river','towns','roads'].forEach(id=>{let f=()=>$(id+'V').textContent=$(id).value;$(id).addEventListener('input',f);f()});
function hash(s){let h=2166136261>>>0;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function RNG(s){let a=hash(s)||1;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const rb=(r,a,b)=>a+(b-a)*r(),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),sm=t=>t*t*(3-2*t);
function noise(seed,cx,cy){const r=RNG(seed),a=Array.from({length:cy},()=>Array.from({length:cx},()=>r()));return(x,y)=>{let gx=x*(cx-1),gy=y*(cy-1),x0=Math.floor(gx),y0=Math.floor(gy),x1=Math.min(cx-1,x0+1),y1=Math.min(cy-1,y0+1),tx=sm(gx-x0),ty=sm(gy-y0);return(a[y0][x0]*(1-tx)+a[y0][x1]*tx)*(1-ty)+(a[y1][x0]*(1-tx)+a[y1][x1]*tx)*ty}}
function pal(){let s=$('style').value;if(s==='verdant')return{deep:'#537987',sea:'#759aa5',shoal:'#9bb2ad',sand:'#d8c58d',grass:'#aebd84',lush:'#819a6c',dry:'#c4a878',high:'#9c9277',forest:'#415e43',mount:'#625c53',snow:'#e4dfcf',river:'#4f7f96',ink:'#40392f',road:'#826744',city:'#332c27'};
if(s==='night')return{deep:'#07131c',sea:'#102735',shoal:'#183745',sand:'#39483f',grass:'#30433b',lush:'#294235',dry:'#4b4437',high:'#4d4d43',forest:'#173426',mount:'#8c887e',snow:'#d7d4c8',river:'#68a9c0',ink:'#d2cdbd',road:'#b09365',city:'#e2c778'};
return{deep:'#617d86',sea:'#7e9ba2',shoal:'#a6b5ad',sand:'#dfcb91',grass:'#c9bd8c',lush:'#9ca57a',dry:'#c8a875',high:'#a79a78',forest:'#52654b',mount:'#665c52',snow:'#e7dfc9',river:'#567f94',ink:'#463c31',road:'#8a6d48',city:'#362e28'}}
function generate(){
 const seed=$('seed').value||'REALM',r=RNG(seed+'features'),P=pal(),sea=+$('sea').value/100,rough=+$('rough').value;
 const NX=350,NY=225,N=NX*NY,e=new Float32Array(N),moist=new Float32Array(N),land=new Uint8Array(N);
 let n1=noise(seed+'a',5+rough,4+rough),n2=noise(seed+'b',13+rough*2,9+rough),n3=noise(seed+'c',28+rough*3,18+rough*2),mn=noise(seed+'m',10,8);
 for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){let nx=x/(NX-1),ny=y/(NY-1),edge=Math.pow(Math.max(Math.abs(nx-.5)*2,Math.abs(ny-.5)*2),2.15);let h=.5*n1(nx,ny)+.32*n2(nx,ny)+.18*n3(nx,ny)-edge*.28;e[y*NX+x]=h;moist[y*NX+x]=mn(nx,ny);land[y*NX+x]=h>sea}
 const at=(px,py)=>{let x=cl(Math.floor(px/W*NX),0,NX-1),y=cl(Math.floor(py/H*NY),0,NY-1);return e[y*NX+x]},isLand=(px,py)=>at(px,py)>sea;
 // Smooth high-res render from interpolated field; avoids visible block pixels.
 let off=document.createElement('canvas');off.width=700;off.height=450;let ox=off.getContext('2d'),img=ox.createImageData(700,450);
 const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)],cols={deep:hx(P.deep),sea:hx(P.sea),shoal:hx(P.shoal),sand:hx(P.sand),grass:hx(P.grass),lush:hx(P.lush),dry:hx(P.dry),high:hx(P.high)};
 function sample(arr,x,y){let gx=x*(NX-1),gy=y*(NY-1),x0=Math.floor(gx),y0=Math.floor(gy),x1=Math.min(NX-1,x0+1),y1=Math.min(NY-1,y0+1),tx=gx-x0,ty=gy-y0;return(arr[y0*NX+x0]*(1-tx)+arr[y0*NX+x1]*tx)*(1-ty)+(arr[y1*NX+x0]*(1-tx)+arr[y1*NX+x1]*tx)*ty}
 for(let y=0;y<450;y++)for(let x=0;x<700;x++){let nx=x/699,ny=y/449,h=sample(e,nx,ny),m=sample(moist,nx,ny),c;if(h<sea-.08)c=cols.deep;else if(h<sea)c=cols.sea;else if(h<sea+.018)c=cols.sand;else if(h>sea+.19)c=cols.high;else if(m<.42+(+$('dry').value-50)/280)c=cols.dry;else if(m>.59)c=cols.lush;else c=cols.grass;let i=(y*700+x)*4;img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255}
 ox.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.clearRect(0,0,W,H);ctx.drawImage(off,0,0,W,H);
 // Coastline traced from land mask using short anti-aliased boundary segments.
 if($('contours').checked){ctx.save();ctx.strokeStyle=P.ink;ctx.globalAlpha=.55;ctx.lineWidth=1.15;ctx.beginPath();for(let y=1;y<NY-1;y+=2)for(let x=1;x<NX-1;x+=2){let i=y*NX+x;if(land[i]!==land[i+1]){let px=(x+.5)/NX*W,py=y/NY*H;ctx.moveTo(px,py-4);ctx.lineTo(px,py+4)}if(land[i]!==land[i+NX]){let px=x/NX*W,py=(y+.5)/NY*H;ctx.moveTo(px-4,py);ctx.lineTo(px+4,py)}}ctx.stroke();ctx.restore()}
 // biome stipple/grass marks
 ctx.save();ctx.strokeStyle=P.ink;ctx.globalAlpha=.13;ctx.lineWidth=.7;for(let i=0;i<650;i++){let x=rb(r,25,W-25),y=rb(r,25,H-25);if(!isLand(x,y))continue;ctx.beginPath();ctx.moveTo(x-2,y+2);ctx.quadraticCurveTo(x,y-3,x+2,y+2);ctx.stroke()}ctx.restore();
 function mountain(x,y,s,variant){ctx.save();ctx.translate(x,y);ctx.strokeStyle=P.mount;ctx.lineWidth=1.25;ctx.fillStyle=P.mount;let lean=(variant-.5)*s*.35;ctx.beginPath();ctx.moveTo(-s,y=0);ctx.lineTo(lean,-s*rb(r,.82,1.18));ctx.lineTo(s,0);ctx.closePath();ctx.globalAlpha=.14;ctx.fill();ctx.globalAlpha=.95;ctx.stroke();ctx.beginPath();ctx.moveTo(lean,-s*.95);ctx.lineTo(lean+s*.16,-s*.42);ctx.lineTo(s*.62,0);ctx.stroke();ctx.fillStyle=P.snow;ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(lean,-s*.95);ctx.lineTo(lean-s*.22,-s*.55);ctx.lineTo(lean-s*.02,-s*.64);ctx.lineTo(lean+s*.15,-s*.5);ctx.closePath();ctx.fill();ctx.restore()}
 // mountain ranges: anchors + chains, with size/lean variation
 let ranges=Math.floor(4+7*(+$('mount').value/100));for(let q=0;q<ranges;q++){let x=rb(r,90,W-90),y=rb(r,90,H-90);if(!isLand(x,y)||at(x,y)<sea+.09){q--;continue}let ang=rb(r,-.9,.9),len=3+Math.floor(r()*7);for(let j=0;j<len;j++){let xx=x+Math.cos(ang)*j*rb(r,20,29)+rb(r,-9,9),yy=y+Math.sin(ang)*j*22+rb(r,-8,8);if(isLand(xx,yy)&&at(xx,yy)>sea+.07)mountain(xx,yy,rb(r,13,27),r())}}
 function tree(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.fillStyle=P.forest;ctx.strokeStyle=P.forest;ctx.globalAlpha=.88;if(t<.65){ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(-s*.6,-s*.1,-s*.38,s*.2);ctx.lineTo(s*.38,s*.2);ctx.quadraticCurveTo(s*.6,-s*.1,0,-s);ctx.fill()}else{ctx.beginPath();ctx.arc(-s*.22,-s*.12,s*.36,0,Math.PI*2);ctx.arc(s*.22,-s*.12,s*.36,0,Math.PI*2);ctx.arc(0,-s*.42,s*.4,0,Math.PI*2);ctx.fill()}ctx.fillRect(-1,s*.12,2,s*.5);ctx.restore()}
 let groves=Math.floor(20+50*(+$('forest').value/100));for(let q=0;q<groves;q++){let x=rb(r,45,W-45),y=rb(r,45,H-45);if(!isLand(x,y)||at(x,y)>sea+.17){q--;continue}for(let j=0,n=3+Math.floor(r()*9);j<n;j++){let xx=x+rb(r,-32,32),yy=y+rb(r,-22,22);if(isLand(xx,yy))tree(xx,yy,rb(r,5,10),r())}}
 // rivers greedily descend elevation and stop at sea
 ctx.strokeStyle=P.river;ctx.lineWidth=2;ctx.globalAlpha=.9;let riverN=Math.floor(3+10*(+$('river').value/100));
 for(let q=0;q<riverN;q++){let x=rb(r,100,W-100),y=rb(r,100,H-100);if(!isLand(x,y)||at(x,y)<sea+.11){q--;continue}ctx.beginPath();ctx.moveTo(x,y);let seen=0;while(seen++<90&&isLand(x,y)){let best=null,bh=at(x,y);for(let k=0;k<16;k++){let a=k*Math.PI/8,xx=x+Math.cos(a)*8,yy=y+Math.sin(a)*8,h=at(xx,yy);if(h<bh){bh=h;best=[xx,yy]}}if(!best)break;x=best[0]+rb(r,-1.5,1.5);y=best[1]+rb(r,-1.5,1.5);ctx.lineTo(x,y)}ctx.stroke()}ctx.globalAlpha=1;
 const A=['Ash','Black','Bright','Dun','Elder','Frost','Gold','Grey','High','Iron','Kings','Moon','North','Oak','Raven','Red','River','Silver','Stone','Storm','West','White','Wolf'],B=['barrow','bridge','crest','dale','fall','ford','gate','haven','hold','keep','mere','moor','port','reach','rest','rock','stead','vale','watch','wick','wood'],used=new Set();function name(){let n;do n=A[Math.floor(r()*A.length)]+B[Math.floor(r()*B.length)];while(used.has(n));used.add(n);return n}
 let towns=[],target=Math.floor(4+17*(+$('towns').value/100)),tries=0;while(towns.length<target&&tries++<2000){let x=rb(r,60,W-60),y=rb(r,60,H-60);if(!isLand(x,y)||at(x,y)>sea+.18||towns.some(p=>Math.hypot(p.x-x,p.y-y)<95))continue;towns.push({x,y,n:name(),cap:r()<.16})}
 // Roads use A* on coarse land-only grid, so they cannot cross water.
 const GW=88,GH=57;function gLand(x,y){return isLand((x+.5)/GW*W,(y+.5)/GH*H)}
 function route(a,b){let sx=cl(Math.floor(a.x/W*GW),0,GW-1),sy=cl(Math.floor(a.y/H*GH),0,GH-1),tx=cl(Math.floor(b.x/W*GW),0,GW-1),ty=cl(Math.floor(b.y/H*GH),0,GH-1),open=[[sx,sy]],came=new Map(),g=new Map([[sx+','+sy,0]]),closed=new Set(),loops=0;
 while(open.length&&loops++<7000){open.sort((p,q)=>(g.get(p[0]+','+p[1])+Math.hypot(p[0]-tx,p[1]-ty))-(g.get(q[0]+','+q[1])+Math.hypot(q[0]-tx,q[1]-ty)));let cur=open.shift(),ck=cur[0]+','+cur[1];if(closed.has(ck))continue;closed.add(ck);if(cur[0]===tx&&cur[1]===ty){let path=[cur];while(came.has(path[0][0]+','+path[0][1]))path.unshift(came.get(path[0][0]+','+path[0][1]));return path.map(p=>[(p[0]+.5)/GW*W,(p[1]+.5)/GH*H])}
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let nx=cur[0]+dx,ny=cur[1]+dy;if(nx<0||ny<0||nx>=GW||ny>=GH||!gLand(nx,ny))continue;let nk=nx+','+ny,ng=g.get(ck)+Math.hypot(dx,dy);if(ng<(g.get(nk)??1e9)){g.set(nk,ng);came.set(nk,cur);open.push([nx,ny])}}}return null}
 ctx.save();ctx.strokeStyle=P.road;ctx.lineWidth=1.6;ctx.globalAlpha=.72;ctx.setLineDash([7,5]);let roadChance=+$('roads').value/100;
 for(let i=0;i<towns.length;i++){if(r()>roadChance)continue;let near=towns.map((p,j)=>[j,Math.hypot(p.x-towns[i].x,p.y-towns[i].y)]).filter(z=>z[0]!==i).sort((a,b)=>a[1]-b[1])[0];if(!near)continue;let path=route(towns[i],towns[near[0]]);if(path){ctx.beginPath();ctx.moveTo(path[0][0],path[0][1]);for(let p of path.slice(1))ctx.lineTo(p[0],p[1]);ctx.stroke()}}ctx.restore();
 for(let p of towns){ctx.save();ctx.translate(p.x,p.y);ctx.strokeStyle=P.city;ctx.fillStyle=P.city;ctx.lineWidth=1.4;if(p.cap){ctx.strokeRect(-5,-4,10,8);ctx.beginPath();ctx.moveTo(-7,-4);ctx.lineTo(0,-11);ctx.lineTo(7,-4);ctx.stroke()}else{ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill()}ctx.restore();if($('labels').checked){ctx.font=p.cap?'bold 17px Georgia':'14px Georgia';ctx.fillStyle=P.ink;ctx.fillText(p.n,p.x+9,p.y-9)}}
 // compass and frame
 ctx.save();ctx.translate(W-68,68);ctx.strokeStyle=P.ink;ctx.fillStyle=P.ink;ctx.globalAlpha=.75;ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(7,0);ctx.lineTo(0,30);ctx.lineTo(-7,0);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(0,7);ctx.lineTo(30,0);ctx.lineTo(0,-7);ctx.closePath();ctx.stroke();ctx.font='bold 14px Georgia';ctx.fillText('N',-5,-38);ctx.restore();
 if($('border').checked){ctx.strokeStyle=P.ink;ctx.globalAlpha=.6;ctx.lineWidth=3;ctx.strokeRect(16,16,W-32,H-32);ctx.lineWidth=1;ctx.strokeRect(22,22,W-44,H-44);ctx.globalAlpha=1}
 $('meta').innerHTML=`<span class="pill">Seed: ${seed}</span><span class="pill">${towns.length} settlements</span><span class="pill">Land-only road routing</span><span class="pill">1400 × 900 PNG</span>`;window._seed=seed}
$('gen').addEventListener('click',generate);$('random').addEventListener('click',()=>{$('seed').value='REALM-'+Math.random().toString(36).slice(2,8).toUpperCase();generate()});$('export').addEventListener('click',()=>{let a=document.createElement('a');a.download='realmforge-'+(window._seed||'map')+'.png';a.href=C.toDataURL('image/png');a.click()});$('style').addEventListener('change',generate);['labels','contours','border'].forEach(x=>$(x).addEventListener('change',generate));generate();
</script></body></html>
