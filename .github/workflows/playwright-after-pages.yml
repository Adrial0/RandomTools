name: Playwright tests
run-name: Playwright · ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: RandomTools commit that Cloudflare published (empty for manual run)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ inputs.source_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Tests currently visit the deployed myrandomtools.com website.
      - name: Run tests
        run: npm test -- --project=chromium --workers=1
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
