name: Start Playwright after Cloudflare Pages

on:
  check_run:
    types: [completed]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.check_run.app.id == 85455 &&
      github.event.check_run.name == 'Cloudflare Pages' &&
      github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or execution of code from RandomTools is needed.
      - name: Check that Cloudflare built the current main commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.check_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api repos/Adrial0/RandomTools/commits/main --jq .sha)
          if [[ "$CHECK_SHA" == "$main_sha" ]]; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped: this check is not for the latest main commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Start tests in the private test repository
        if: steps.main.outputs.matches == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLAYWRIGHT_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.event.check_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Missing Actions secret PLAYWRIGHT_DISPATCH_TOKEN.' >&2
            exit 1
          fi
          gh workflow run playwright.yml \
            --repo Adrial0/playwright-test \
            --ref main \
            -f source_sha="$SOURCE_SHA"
          echo 'Test run requested. This job does not report whether tests passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Results: https://github.com/Adrial0/playwright-test/actions/workflows/playwright.yml' >> "$GITHUB_STEP_SUMMARY"
