<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Advanced single-item pixel generator with deep customization controls.">
<title>ItemForge — Advanced Pixel Item Generator | My Random Tools</title>
<style>
:root{--bg:#0d0f12;--panel:#14171b;--panel2:#191d22;--input:#0b1015;--border:#2a3037;--text:#f2f0e9;--muted:#9ca3aa;--accent:#e4b45c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.sitebar{max-width:1450px;margin:auto;min-height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:700}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:#15120c;font:800 13px Consolas,monospace}
nav{display:flex;gap:8px}nav a{color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:8px;font-size:13px}nav a:hover{color:var(--text);background:var(--panel)}
.app{max-width:1450px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:24px;margin:0}.sub{color:var(--muted);margin-top:4px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px;font-weight:650;cursor:pointer}.primary{background:var(--accent);color:#181207;border-color:var(--accent)}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr) 300px;gap:12px}.panel,.preview{background:var(--panel);border:1px solid var(--border);border-radius:12px}.panel{padding:14px}
.section{padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid var(--border)}.section:last-child{border:0;margin:0}.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin:0 0 9px}
label{display:block;margin:8px 0 4px;font-size:13px}select,input[type=text],input[type=color]{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px}
.slider{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center}input[type=range]{width:100%;accent-color:var(--accent)}.v{text-align:right;color:var(--muted);font-size:12px}
.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check label{margin:0}.check input{accent-color:var(--accent)}
.preview{padding:12px;display:flex;flex-direction:column}.canvas-wrap{min-height:650px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(45deg,#12161b 25%,transparent 25%),linear-gradient(-45deg,#12161b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#12161b 75%),linear-gradient(-45deg,transparent 75%,#12161b 75%),#0a0e13;background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}
canvas{display:block;image-rendering:pixelated;width:min(620px,88%);height:auto;max-width:none}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px}.pill{border:1px solid var(--border);border-radius:99px;padding:4px 8px}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.palette input{height:38px;padding:2px}.hint{color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:1180px){.layout{grid-template-columns:330px 1fr}.right{grid-column:1/-1}}@media(max-width:800px){.layout{grid-template-columns:1fr}.right{grid-column:auto}.canvas-wrap{min-height:480px}}
</style>
</head>
<body>
<header class="sitebar">
<a class="brand" href="/"><span class="mark">MR/</span><span>My Random Tools</span></a>
<nav><a href="/">Home</a><a href="/#tools">All Tools</a></nav>
</header>

<div class="app">
<div class="top">
<div><h1>ItemForge</h1><div class="sub">Build one pixel-art item at a time with deeper controls than PixelForge.</div></div>
<div class="actions">
<button id="randomize">Randomize Settings</button>
<button id="reroll">Reroll Design</button>
<button id="generate" class="primary">Generate Item</button>
<button id="export">Export PNG</button>
<button id="export4">Export 4× PNG</button>
</div>
</div>

<div class="layout">
<aside class="panel">
<div class="section"><h2>Item</h2>
<label>Category</label><select id="category"></select>
<label>Subtype</label><select id="subtype"></select>
<label>Seed</label><input id="seed" type="text" value="ITEM-001">
<label>Sprite size</label><select id="size"><option value="32">32 × 32</option><option value="64" selected>64 × 64</option><option value="128">128 × 128</option></select>
</div>

<div class="section"><h2>Shape</h2>
<label id="aLabel">Length</label><div class="slider"><input id="a" type="range" min="0" max="100" value="60"><span id="aV" class="v"></span></div>
<label id="bLabel">Width</label><div class="slider"><input id="b" type="range" min="0" max="100" value="48"><span id="bV" class="v"></span></div>
<label id="cLabel">Curve</label><div class="slider"><input id="c" type="range" min="0" max="100" value="35"><span id="cV" class="v"></span></div>
<label>Symmetry</label><div class="slider"><input id="sym" type="range" min="0" max="100" value="85"><span id="symV" class="v"></span></div>
</div>

<div class="section"><h2>Surface</h2>
<label>Detail</label><div class="slider"><input id="detail" type="range" min="0" max="100" value="62"><span id="detailV" class="v"></span></div>
<label>Ornament</label><div class="slider"><input id="ornament" type="range" min="0" max="100" value="35"><span id="ornamentV" class="v"></span></div>
<label>Wear / damage</label><div class="slider"><input id="wear" type="range" min="0" max="100" value="10"><span id="wearV" class="v"></span></div>
<label>Outline</label><div class="slider"><input id="outline" type="range" min="0" max="3" value="1"><span id="outlineV" class="v"></span></div>
</div>
</aside>

<main class="preview">
<div class="canvas-wrap"><canvas id="canvas" width="64" height="64"></canvas></div>
<div id="meta" class="meta"></div>
</main>

<aside class="panel right">
<div class="section"><h2>Materials</h2>
<label>Main material</label><select id="mainMat"><option>Steel</option><option>Iron</option><option>Gold</option><option>Bronze</option><option>Wood</option><option>Bone</option><option>Obsidian</option><option>Crystal</option></select>
<label>Accent material</label><select id="accentMat"><option>Gold</option><option>Silver</option><option>Bronze</option><option>Leather</option><option>Wood</option><option>Crystal</option><option>Bone</option></select>
</div>

<div class="section"><h2>Palette</h2>
<label>Preset</label><select id="preset"><option value="classic">Classic Fantasy</option><option value="dark">Dark Fantasy</option><option value="fire">Fire</option><option value="ice">Ice</option><option value="poison">Poison</option><option value="royal">Royal</option><option value="custom">Custom</option></select>
<div class="palette">
<input id="dark" type="color" value="#20242b"><input id="primary" type="color" value="#7f98ad"><input id="secondary" type="color" value="#d0a85e">
<input id="highlight" type="color" value="#e4edf2"><input id="accent" type="color" value="#7d4f3e"><input id="magicColor" type="color" value="#8d6ad8">
</div>
</div>

<div class="section"><h2>Enchanting</h2>
<div class="check"><input id="enchanted" type="checkbox"><label for="enchanted">Enchanted</label></div>
<label>Magic intensity</label><div class="slider"><input id="magic" type="range" min="0" max="100" value="45"><span id="magicV" class="v"></span></div>
<label>Effect</label><select id="effect"><option value="runes">Runes</option><option value="core">Glowing core</option><option value="edge">Glowing edge</option><option value="gem">Embedded gem</option></select>
</div>

<div class="section"><h2>Output</h2>
<div class="check"><input id="shadow" type="checkbox" checked><label for="shadow">Preview shadow</label></div>
<p class="hint">Exports are transparent PNGs. Reroll Design keeps your settings but changes the procedural variation.</p>
</div>
</aside>
</div>
</div>

<script>
const $=id=>document.getElementById(id),C=$('canvas'),g=C.getContext('2d');

const types={
sword:['Longsword','Broadsword','Sabre','Dagger','Rapier','Greatsword','Split Blade'],
axe:['Battle Axe','Double Axe','Bearded Axe','Hatchet','Crescent Axe','War Cleaver'],
bow:['Longbow','Recurve Bow','Shortbow','War Bow','Ornate Bow'],
shield:['Kite','Round','Heater','Tower','Buckler','Fantasy'],
potion:['Round Flask','Square Bottle','Triangular Flask','Tall Vial','Bulbous Bottle','Crystal Bottle'],
staff:['Crystal Staff','Druid Staff','Hooked Staff','Orb Staff','Crescent Staff','Wand'],
ring:['Gem Ring','Signet Ring','Band','Crown Ring','Round Amulet','Diamond Amulet'],
helmet:['Nasal Helm','Great Helm','Horned Helm','Pointed Helm','Open Helm','Crested Helm'],
armor:['Breastplate','Full Plate','Scale Armor','Chain Shirt','Leather Armor','Robe Armor','Ornate Plate'],
book:['Plain Tome','Banded Tome','Gemmed Tome','Sigil Tome','Open Book','Scroll','Rune Scroll'],
gem:['Diamond Cut','Hex Cut','Square Cut','Triangular Cut','Shard','Cluster'],
key:['Round Bow','Square Bow','Diamond Bow','Hex Bow','Ornate Key','Skeleton Key'],
coin:['Crown Coin','Sword Coin','Star Coin','Skull Coin','Rune Coin','Plain Coin'],
spell:['Star Rune','Flame','Eye','Lightning','Moon','Sigil','Shield Rune','Portal']
};

const labels={
sword:['Blade length','Blade width','Blade curve'],axe:['Handle length','Head size','Blade curve'],bow:['Bow height','Limb thickness','Recurve'],
shield:['Shield height','Shield width','Pointedness'],potion:['Bottle height','Bottle width','Neck width'],staff:['Staff length','Head size','Staff bend'],
ring:['Overall size','Band thickness','Gem size'],helmet:['Helmet height','Helmet width','Face opening'],armor:['Armor height','Shoulder width','Waist taper'],
book:['Book height','Book width','Spine thickness'],gem:['Gem height','Gem width','Facet depth'],key:['Key length','Bow size','Tooth complexity'],
coin:['Coin size','Rim thickness','Emblem size'],spell:['Symbol size','Stroke width','Shape complexity']
};

const presets={
classic:['#20242b','#7f98ad','#d0a85e','#e4edf2','#7d4f3e','#8d6ad8'],
dark:['#101318','#4d5560','#8e667c','#c8c0b8','#4c303a','#9a4f76'],
fire:['#291510','#9e3421','#df762d','#ffd27b','#6e2b20','#ff9b3d'],
ice:['#13222c','#4d7992','#85b6c9','#e0f5fa','#40586f','#87d9ff'],
poison:['#142017','#42633d','#7da956','#d8ec9b','#553f66','#9ee75f'],
royal:['#1b1630','#5a3a82','#c1a15d','#eee0b7','#3a507c','#a77adc']
};

const materialColors={
Steel:['#20262d','#788c9a','#c3d0d7'],
Iron:['#171a1e','#515861','#8b9299'],
Gold:['#2c210d','#b9872f','#f0cf77'],
Bronze:['#312015','#8e5c34','#c99561'],
Wood:['#2a1a12','#744a30','#b1764d'],
Bone:['#302c25','#b8aa8c','#e6d9bd'],
Obsidian:['#100e15','#2b2638','#685a83'],
Crystal:['#142630','#568da5','#b5e8f4'],
Silver:['#22272d','#929ea8','#e8f0f4'],
Leather:['#2a1913','#754630','#b47758']
};

function hexRgb(h){
  return[
    parseInt(h.slice(1,3),16),
    parseInt(h.slice(3,5),16),
    parseInt(h.slice(5,7),16)
  ];
}

function mixColor(a,b,t){
  const A=hexRgb(a),B=hexRgb(b);
  return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');
}

function activePalette(){
  const base=palette();
  const main=materialColors[$('mainMat').value]||materialColors.Steel;
  const accent=materialColors[$('accentMat').value]||materialColors.Gold;

  const mainBase=mixColor(main[1],base.p,.62);
  const mainHi=mixColor(main[2],base.h,.55);
  const accentBase=mixColor(accent[1],base.s,.62);
  const accentHi=mixColor(accent[2],base.h,.42);

  return{
    d:mixColor(base.d,main[0],.28),
    p:mainBase,
    ph:mainHi,
    s:accentBase,
    sh:accentHi,
    h:base.h,
    a:base.a,
    m:base.m
  };
}

function boundsOfCanvas(){
  const d=g.getImageData(0,0,C.width,C.height).data;
  let minX=C.width,minY=C.height,maxX=-1,maxY=-1;
  for(let y=0;y<C.height;y++)for(let x=0;x<C.width;x++){
    if(d[(y*C.width+x)*4+3]>15){
      if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
    }
  }
  return maxX<0?null:{minX,minY,maxX,maxY};
}

function applySymmetry(amount,cat){
  if(amount<55)return;
  if(['sword','axe','bow','staff','key'].includes(cat))return;
  const img=g.getImageData(0,0,C.width,C.height);
  const d=img.data,w=C.width,h=C.height;
  const strength=(amount-55)/45;
  for(let y=0;y<h;y++){
    for(let x=0;x<Math.floor(w/2);x++){
      const mx=w-1-x;
      const li=(y*w+x)*4,ri=(y*w+mx)*4;
      const la=d[li+3],ra=d[ri+3];
      if(la>ra){
        for(let k=0;k<4;k++)d[ri+k]=Math.round(d[ri+k]*(1-strength)+d[li+k]*strength);
      }else if(ra>la){
        for(let k=0;k<4;k++)d[li+k]=Math.round(d[li+k]*(1-strength)+d[ri+k]*strength);
      }
    }
  }
  g.putImageData(img,0,0);
}

function addUniversalDetail(s,r,p,x,cat){
  const b=boundsOfCanvas();if(!b)return;
  const cx=(b.minX+b.maxX)/2,cy=(b.minY+b.maxY)/2,w=b.maxX-b.minX+1,h=b.maxY-b.minY+1;
  g.save();

  if(x.detail>.25){
    g.strokeStyle=p.ph||p.h;g.globalAlpha=.28+.45*x.detail;g.lineWidth=1;
    if(['shield','helmet','armor','book','gem','coin','potion'].includes(cat)){
      g.beginPath();g.moveTo(cx,cy-h*.28);g.lineTo(cx,cy+h*.28);g.stroke();
    }else if(['sword','axe','staff','bow','key'].includes(cat)){
      g.beginPath();g.moveTo(cx-w*.15,cy-h*.18);g.lineTo(cx+w*.15,cy+h*.18);g.stroke();
    }else if(cat==='spell'){
      g.beginPath();g.arc(cx,cy,Math.max(2,Math.min(w,h)*.23),0,Math.PI*2);g.stroke();
    }
  }

  if(x.detail>.7){
    g.strokeStyle=p.h;g.globalAlpha=.35;g.lineWidth=1;
    g.beginPath();g.moveTo(b.minX+w*.2,b.minY+h*.22);g.lineTo(b.minX+w*.42,b.minY+h*.12);g.stroke();
  }

  if(x.orn>.2){
    g.fillStyle=p.s;g.globalAlpha=.45+.35*x.orn;
    if(['shield','armor','helmet','book','coin','gem'].includes(cat)){
      const rr=Math.max(1,Math.round(Math.min(w,h)*(.025+.025*x.orn)));
      g.beginPath();g.arc(cx,cy,rr,0,Math.PI*2);g.fill();
    }else if(['sword','axe','staff','bow','key'].includes(cat)){
      const bw=Math.max(2,Math.round(w*(.12+.12*x.orn)));
      g.fillRect(Math.round(cx-bw/2),Math.round(cy),bw,Math.max(1,Math.round(s*.018)));
    }else if(cat==='potion'){
      g.strokeStyle=p.s;g.lineWidth=Math.max(1,Math.round(s*.018));g.strokeRect(cx-w*.12,cy-h*.06,w*.24,h*.12);
    }else if(cat==='ring'){
      g.beginPath();g.arc(cx,cy-h*.28,Math.max(1,s*.025+s*.025*x.orn),0,Math.PI*2);g.fill();
    }else if(cat==='spell'){
      const rr=Math.max(2,Math.min(w,h)*(.12+.08*x.orn));g.strokeStyle=p.s;g.lineWidth=1;g.beginPath();g.arc(cx,cy,rr,0,Math.PI*2);g.stroke();
    }
  }

  if(x.orn>.72){
    g.strokeStyle=p.sh||p.h;g.globalAlpha=.55;g.lineWidth=1;
    if(['shield','armor','helmet','book','gem','coin'].includes(cat)){
      g.beginPath();g.moveTo(cx-w*.2,cy);g.lineTo(cx,cy-h*.18);g.lineTo(cx+w*.2,cy);g.lineTo(cx,cy+h*.18);g.closePath();g.stroke();
    }
  }

  g.restore();
}


function hash(s){let h=2166136261>>>0;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function RNG(s){let a=hash(s)||1;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>Math.floor(a+r()*(b-a+1));

function palette(){return{d:$('dark').value,p:$('primary').value,s:$('secondary').value,h:$('highlight').value,a:$('accent').value,m:$('magicColor').value}}
function v(){return{sub:+$('subtype').value,a:+$('a').value,b:+$('b').value,c:+$('c').value,sym:+$('sym').value,detail:+$('detail').value/100,orn:+$('ornament').value/100,wear:+$('wear').value/100,out:+$('outline').value,magic:+$('magic').value/100}}

function drawSword(s,r,p,x){const cx=s/2,top=s*.08,len=s*(.45+x.a*.003),bw=s*(.025+x.b*.0008),bend=(x.c-50)*s*.0018;g.fillStyle=p.p;g.strokeStyle=p.d;g.lineWidth=x.out;g.beginPath();if(x.sub===2){g.moveTo(cx,top);g.quadraticCurveTo(cx+bend+s*.1,top+len*.5,cx+bw,top+len);g.lineTo(cx-bw*.2,top+len);g.quadraticCurveTo(cx+bend*.25,top+len*.5,cx,top)}else if(x.sub===3){let l=len*.65;g.moveTo(cx,top);g.lineTo(cx+bw*1.8,top+l);g.lineTo(cx-bw*1.8,top+l)}else{let mul=x.sub===1?1.7:1;g.moveTo(cx,top);g.lineTo(cx+bw,top+s*.07);g.lineTo(cx+bw*mul,top+len);g.lineTo(cx-bw*mul,top+len);g.lineTo(cx-bw,top+s*.07)}g.closePath();g.fill();if(x.out)g.stroke();let gy=top+len;g.fillStyle=p.s;g.fillRect(cx-s*.2,gy,s*.4,s*.045);g.fillStyle=p.a;g.fillRect(cx-s*.022,gy+s*.04,s*.044,s*.18);if(x.detail>.45){g.fillStyle=p.ph||p.h;g.fillRect(cx,top+s*.08,1,len-s*.12)}}
function drawAxe(s,r,p,x){const cx=s/2,top=s*.15,handle=s*(.4+x.a*.003),head=s*(.1+x.b*.002);g.fillStyle=p.a;g.fillRect(cx-s*.022,top+s*.11,s*.044,handle);g.fillStyle=p.p;g.strokeStyle=p.d;g.lineWidth=x.out;g.beginPath();if(x.sub===1){g.moveTo(cx,top+s*.08);g.lineTo(cx-head,top);g.lineTo(cx-head*.8,top+head*1.4);g.lineTo(cx,top+head);g.lineTo(cx+head*.8,top+head*1.4);g.lineTo(cx+head,top)}else{g.moveTo(cx,top+s*.08);g.lineTo(cx-head,top);g.quadraticCurveTo(cx-head*1.15,top+head*.8,cx-head*.2,top+head*1.4);g.lineTo(cx,top+head)}g.closePath();g.fill();if(x.out)g.stroke()}
function drawBow(s,r,p,x){const cx=s/2,top=s*.1,bottom=s*.9,bend=s*(.08+x.c*.0016);g.strokeStyle=p.a;g.lineWidth=Math.max(2,s*(.02+x.b*.0004));g.beginPath();g.moveTo(cx,top);if(x.sub===1||x.sub===4){g.bezierCurveTo(cx-bend*.2,top+s*.12,cx-bend,s*.42,cx-bend*.65,s*.5);g.bezierCurveTo(cx-bend,s*.58,cx-bend*.2,bottom-s*.12,cx,bottom)}else g.quadraticCurveTo(cx-bend,s*.5,cx,bottom);g.stroke();g.strokeStyle=p.h;g.lineWidth=1;g.beginPath();g.moveTo(cx,top);g.lineTo(cx,bottom);g.stroke();if(x.detail>.45){g.strokeStyle=p.s;g.beginPath();g.moveTo(cx,s*.5);g.lineTo(cx-s*.28,s*.5);g.stroke();g.fillStyle=p.s;g.beginPath();g.moveTo(cx-s*.31,s*.5);g.lineTo(cx-s*.24,s*.46);g.lineTo(cx-s*.24,s*.54);g.closePath();g.fill()}}
function drawShield(s,r,p,x){const cx=s/2,cy=s/2,w=s*(.25+x.b*.003),h=s*(.28+x.a*.003);g.fillStyle=p.p;g.strokeStyle=p.d;g.lineWidth=x.out;g.beginPath();if(x.sub===1||x.sub===4)g.arc(cx,cy,Math.min(w,h)*.55,0,Math.PI*2);else if(x.sub===3)g.rect(cx-w*.5,cy-h*.5,w,h);else{g.moveTo(cx-w*.5,cy-h*.45);g.lineTo(cx+w*.5,cy-h*.45);g.lineTo(cx+w*.38,cy+h*.12);g.lineTo(cx,cy+h*.5);g.lineTo(cx-w*.38,cy+h*.12)}g.closePath();g.fill();if(x.out)g.stroke();g.strokeStyle=p.ph;g.lineWidth=1;g.globalAlpha=.45;g.beginPath();g.moveTo(cx-w*.32,cy-h*.28);g.lineTo(cx+w*.22,cy-h*.28);g.stroke();g.globalAlpha=1;if(x.orn>.3){g.fillStyle=p.s;g.fillRect(cx-1,cy-h*.35,2,h*.7)}if(x.orn>.6){g.fillRect(cx-w*.28,cy-1,w*.56,2)}}
function drawPotion(s,r,p,x){const cx=s/2,bw=s*(.16+x.b*.003),bh=s*(.24+x.a*.003),y=s*.3,neck=s*(.05+x.c*.0008);g.fillStyle=p.s;g.fillRect(cx-neck/2,s*.14,neck,s*.13);g.fillStyle=p.m;g.strokeStyle=p.d;g.lineWidth=x.out;g.beginPath();if(x.sub===1)g.rect(cx-bw/2,y,bw,bh);else if(x.sub===2){g.moveTo(cx-neck/2,y);g.lineTo(cx-bw/2,y+bh);g.lineTo(cx+bw/2,y+bh);g.lineTo(cx+neck/2,y)}else{g.moveTo(cx-neck/2,y);g.quadraticCurveTo(cx-bw*.55,y+bh*.25,cx-bw*.45,y+bh*.7);g.quadraticCurveTo(cx,y+bh*1.05,cx+bw*.45,y+bh*.7);g.quadraticCurveTo(cx+bw*.55,y+bh*.25,cx+neck/2,y)}g.closePath();g.fill();if(x.out)g.stroke();if(x.detail>.4){g.fillStyle=p.ph||p.h;g.fillRect(cx-bw*.22,y+bh*.22,1,bh*.32)}}
function drawStaff(s,r,p,x){const cx=s/2,top=s*.08,bottom=s*.9,head=s*(.055+x.b*.0013);g.fillStyle=p.a;g.fillRect(cx-s*.02,top+head*1.8,s*.04,bottom-top-head*1.6);g.fillStyle=p.m;g.strokeStyle=p.d;g.lineWidth=x.out;g.beginPath();if(x.sub===3)g.arc(cx,top+head,head,0,Math.PI*2);else{g.moveTo(cx,top);g.lineTo(cx+head,top+head);g.lineTo(cx,top+head*2);g.lineTo(cx-head,top+head)}g.closePath();g.fill();if(x.out)g.stroke()}
function drawRing(s,r,p,x){const cx=s/2,cy=s*.56,rad=s*(.1+x.a*.0018);g.strokeStyle=p.s;g.lineWidth=Math.max(2,s*(.02+x.b*.0004));g.beginPath();g.arc(cx,cy,rad,0,Math.PI*2);g.stroke();g.fillStyle=p.m;let gr=s*(.025+x.c*.0008);g.beginPath();g.moveTo(cx,cy-rad-gr);g.lineTo(cx+gr,cy-rad);g.lineTo(cx,cy-rad+gr);g.lineTo(cx-gr,cy-rad);g.closePath();g.fill()}
function drawHelmet(s,r,p,x){const cx=s/2,cy=s*.55,w=s*(.24+x.b*.003),h=s*(.22+x.a*.0027);g.fillStyle=p.p;g.strokeStyle=p.d;g.lineWidth=x.out;g.beginPath();if(x.sub===3){g.moveTo(cx,cy-h*.7);g.lineTo(cx+w*.5,cy-h*.15);g.lineTo(cx+w*.36,cy+h*.45);g.lineTo(cx-w*.36,cy+h*.45);g.lineTo(cx-w*.5,cy-h*.15)}else{g.arc(cx,cy,w*.5,Math.PI,0);g.lineTo(cx+w*.42,cy+h*.45);g.lineTo(cx-w*.42,cy+h*.45)}g.closePath();g.fill();if(x.out)g.stroke()}
function drawArmor(s,r,p,x){
  const cx=s/2,top=s*.16,w=s*(.22+x.b*.003),h=s*(.34+x.a*.0032);
  const sub=x.sub;

  g.strokeStyle=p.d;
  g.lineWidth=x.out;

  if(sub===0){
    g.fillStyle=p.p;
    g.beginPath();
    g.moveTo(cx-w*.28,top);
    g.lineTo(cx+w*.28,top);
    g.lineTo(cx+w*.42,top+h*.24);
    g.lineTo(cx+w*.28,top+h*.82);
    g.lineTo(cx,top+h);
    g.lineTo(cx-w*.28,top+h*.82);
    g.lineTo(cx-w*.42,top+h*.24);
    g.closePath();
    g.fill();
    if(x.out)g.stroke();
    g.strokeStyle=p.ph;
    g.lineWidth=1;
    g.beginPath();
    g.moveTo(cx,top+s*.03);
    g.lineTo(cx,top+h*.7);
    g.stroke();
  }
  else if(sub===1){
    g.fillStyle=p.p;
    g.beginPath();
    g.moveTo(cx-w*.3,top+s*.03);
    g.lineTo(cx+w*.3,top+s*.03);
    g.lineTo(cx+w*.42,top+h*.18);
    g.lineTo(cx+w*.62,top+h*.25);
    g.lineTo(cx+w*.42,top+h*.42);
    g.lineTo(cx+w*.3,top+h*.92);
    g.lineTo(cx,top+h);
    g.lineTo(cx-w*.3,top+h*.92);
    g.lineTo(cx-w*.42,top+h*.42);
    g.lineTo(cx-w*.62,top+h*.25);
    g.lineTo(cx-w*.42,top+h*.18);
    g.closePath();
    g.fill();
    if(x.out)g.stroke();

    g.fillStyle=p.s;
    g.fillRect(cx-w*.53,top+h*.22,w*.18,h*.13);
    g.fillRect(cx+w*.35,top+h*.22,w*.18,h*.13);

    g.strokeStyle=p.ph;
    g.lineWidth=1;
    g.beginPath();
    g.moveTo(cx-w*.18,top+h*.15);
    g.lineTo(cx,top+h*.35);
    g.lineTo(cx+w*.18,top+h*.15);
    g.stroke();
  }
  else if(sub===2){
    g.fillStyle=p.p;
    g.beginPath();
    g.moveTo(cx-w*.34,top);
    g.lineTo(cx+w*.34,top);
    g.lineTo(cx+w*.38,top+h*.88);
    g.lineTo(cx,top+h);
    g.lineTo(cx-w*.38,top+h*.88);
    g.closePath();
    g.fill();
    if(x.out)g.stroke();

    g.strokeStyle=p.d;
    g.lineWidth=1;
    const rowH=Math.max(3,s*.055);
    const colW=Math.max(4,s*.07);
    for(let yy=top+s*.08;yy<top+h*.82;yy+=rowH){
      for(let xx=cx-w*.26;xx<cx+w*.26;xx+=colW){
        g.beginPath();
        g.arc(xx,yy,colW*.42,0,Math.PI);
        g.stroke();
      }
    }
  }
  else if(sub===3){
    g.fillStyle=p.p;
    g.beginPath();
    g.moveTo(cx-w*.32,top);
    g.lineTo(cx+w*.32,top);
    g.lineTo(cx+w*.36,top+h*.78);
    g.lineTo(cx+w*.22,top+h*.92);
    g.lineTo(cx-w*.22,top+h*.92);
    g.lineTo(cx-w*.36,top+h*.78);
    g.closePath();
    g.fill();
    if(x.out)g.stroke();

    g.strokeStyle=p.d;
    g.lineWidth=1;
    const step=Math.max(3,s*.045);
    for(let yy=top+s*.06;yy<top+h*.76;yy+=step){
      for(let xx=cx-w*.25;xx<cx+w*.25;xx+=step){
        g.beginPath();
        g.arc(xx,yy,step*.3,0,Math.PI*2);
        g.stroke();
      }
    }
  }
  else if(sub===4){
    g.fillStyle=p.a;
    g.beginPath();
    g.moveTo(cx-w*.34,top);
    g.lineTo(cx+w*.34,top);
    g.lineTo(cx+w*.4,top+h*.75);
    g.lineTo(cx,top+h);
    g.lineTo(cx-w*.4,top+h*.75);
    g.closePath();
    g.fill();
    if(x.out)g.stroke();

    g.strokeStyle=p.s;
    g.lineWidth=Math.max(1,s*.025);
    g.beginPath();
    g.moveTo(cx-w*.16,top+s*.05);
    g.lineTo(cx+w*.12,top+h*.72);
    g.stroke();
    g.beginPath();
    g.moveTo(cx+w*.16,top+s*.05);
    g.lineTo(cx-w*.12,top+h*.72);
    g.stroke();
  }
  else if(sub===5){
    g.fillStyle=p.a;
    g.beginPath();
    g.moveTo(cx-w*.24,top);
    g.lineTo(cx+w*.24,top);
    g.lineTo(cx+w*.48,top+h*.2);
    g.lineTo(cx+w*.6,top+h);
    g.lineTo(cx-w*.6,top+h);
    g.lineTo(cx-w*.48,top+h*.2);
    g.closePath();
    g.fill();
    if(x.out)g.stroke();

    g.fillStyle=p.p;
    g.fillRect(cx-w*.18,top+h*.15,w*.36,h*.48);
    g.fillStyle=p.s;
    g.fillRect(cx-w*.23,top+h*.58,w*.46,Math.max(2,s*.035));
  }
  else{
    g.fillStyle=p.p;
    g.beginPath();
    g.moveTo(cx-w*.3,top);
    g.lineTo(cx+w*.3,top);
    g.lineTo(cx+w*.46,top+h*.22);
    g.lineTo(cx+w*.34,top+h*.84);
    g.lineTo(cx,top+h);
    g.lineTo(cx-w*.34,top+h*.84);
    g.lineTo(cx-w*.46,top+h*.22);
    g.closePath();
    g.fill();
    if(x.out)g.stroke();

    g.strokeStyle=p.s;
    g.lineWidth=Math.max(1,s*.025);
    g.beginPath();
    g.moveTo(cx,top+h*.08);
    g.lineTo(cx+w*.18,top+h*.34);
    g.lineTo(cx,top+h*.62);
    g.lineTo(cx-w*.18,top+h*.34);
    g.closePath();
    g.stroke();

    g.fillStyle=p.m;
    g.beginPath();
    g.arc(cx,top+h*.35,Math.max(2,s*.035),0,Math.PI*2);
    g.fill();
  }

  if(x.orn>.55){
    g.fillStyle=p.s;
    g.fillRect(cx-w*.28,top+h*.48,w*.56,Math.max(1,s*.025));
  }
}

function drawBook(s,r,p,x){const cx=s/2,cy=s/2,w=s*(.2+x.b*.0033),h=s*(.23+x.a*.003);g.fillStyle=p.a;g.strokeStyle=p.d;g.lineWidth=x.out;g.fillRect(cx-w/2,cy-h/2,w,h);if(x.out)g.strokeRect(cx-w/2,cy-h/2,w,h);if(x.orn>.3){g.fillStyle=p.s;g.fillRect(cx-w*.38,cy-h*.38,2,h*.76)}if(x.orn>.65){g.fillStyle=p.m;g.beginPath();g.arc(cx,cy,s*.045,0,Math.PI*2);g.fill()}}
function drawGem(s,r,p,x){const cx=s/2,cy=s/2,w=s*(.16+x.b*.003),h=s*(.19+x.a*.003);g.fillStyle=p.m;g.strokeStyle=p.d;g.lineWidth=x.out;g.beginPath();if(x.sub===1)g.rect(cx-w/2,cy-h/2,w,h);else if(x.sub===2){g.moveTo(cx,cy-h/2);g.lineTo(cx+w/2,cy+h/2);g.lineTo(cx-w/2,cy+h/2)}else{g.moveTo(cx,cy-h/2);g.lineTo(cx+w/2,cy);g.lineTo(cx,cy+h/2);g.lineTo(cx-w/2,cy)}g.closePath();g.fill();if(x.out)g.stroke();if(x.detail>.4){g.fillStyle=p.h;g.beginPath();g.moveTo(cx-w*.2,cy-h*.15);g.lineTo(cx,cy-h*.35);g.lineTo(cx,cy);g.closePath();g.fill()}}
function drawKey(s,r,p,x){const cx=s*.3,cy=s*.5,len=s*(.3+x.a*.0035),rad=s*(.05+x.b*.0012);g.strokeStyle=p.s;g.lineWidth=Math.max(2,s*.035);g.beginPath();if(x.sub===1)g.rect(cx-rad,cy-rad,rad*2,rad*2);else g.arc(cx,cy,rad,0,Math.PI*2);g.stroke();g.fillStyle=p.s;g.fillRect(cx+rad,cy-1,len,2);let n=1+Math.floor(x.c/24);for(let i=0;i<n;i++)g.fillRect(cx+rad+len*(.55+i*.1),cy,2,s*.06)}
function drawCoin(s,r,p,x){const cx=s/2,cy=s/2,rad=s*(.11+x.a*.002);g.fillStyle=p.s;g.strokeStyle=p.d;g.lineWidth=x.out;g.beginPath();g.arc(cx,cy,rad,0,Math.PI*2);g.fill();if(x.out)g.stroke();g.strokeStyle=p.h;g.lineWidth=1;g.beginPath();g.arc(cx,cy,rad-s*.03,0,Math.PI*2);g.stroke();g.fillStyle=p.p;g.beginPath();g.arc(cx,cy,rad*.24,0,Math.PI*2);g.fill()}
function drawSpell(s,r,p,x){const cx=s/2,cy=s/2,rad=s*(.13+x.a*.002);g.strokeStyle=p.m;g.fillStyle=p.m;g.lineWidth=Math.max(1,s*(.015+x.b*.0003));if(x.sub===0){g.beginPath();for(let i=0;i<=10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?rad*.42:rad,xx=cx+Math.cos(a)*rr,yy=cy+Math.sin(a)*rr;i?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.stroke()}else if(x.sub===1){g.beginPath();g.moveTo(cx,cy-rad);g.quadraticCurveTo(cx+rad*.7,cy-rad*.15,cx+rad*.2,cy+rad);g.quadraticCurveTo(cx,cy+rad*.5,cx-rad*.2,cy+rad);g.quadraticCurveTo(cx-rad*.75,cy,cx,cy-rad);g.fill()}else{g.beginPath();g.arc(cx,cy,rad,0,Math.PI*2);g.stroke();g.beginPath();g.arc(cx,cy,rad*.55,0,Math.PI*2);g.stroke()}}

const drawers={sword:drawSword,axe:drawAxe,bow:drawBow,shield:drawShield,potion:drawPotion,staff:drawStaff,ring:drawRing,helmet:drawHelmet,armor:drawArmor,book:drawBook,gem:drawGem,key:drawKey,coin:drawCoin,spell:drawSpell};

function sync(){
  const cat=$('category').value;
  $('subtype').innerHTML=types[cat].map((x,i)=>`<option value="${i}">${x}</option>`).join('');
  const l=labels[cat];$('aLabel').textContent=l[0];$('bLabel').textContent=l[1];$('cLabel').textContent=l[2];
}

let salt=0;

function render(){
  const s=+$('size').value,cat=$('category').value,x=v(),p=activePalette(),r=RNG(($('seed').value||'ITEM')+'-'+salt+'-'+cat+'-'+x.sub);
  C.width=C.height=s;g.clearRect(0,0,s,s);g.imageSmoothingEnabled=false;
  if($('shadow').checked){g.save();g.globalAlpha=.18;g.fillStyle='#000';g.beginPath();g.ellipse(s*.52,s*.8,s*.22,s*.065,0,0,Math.PI*2);g.fill();g.restore()}
  drawers[cat](s,r,p,x);
  applySymmetry(x.sym,cat);
  addUniversalDetail(s,r,p,x,cat);
  if(x.wear>0){g.save();g.globalAlpha=.35;g.fillStyle=p.d;for(let i=0;i<Math.floor(x.wear*14);i++)g.fillRect(ri(r,s*.24,s*.76),ri(r,s*.2,s*.8),ri(r,1,Math.max(1,s*.025)),1);g.restore()}
  if($('enchanted').checked){g.save();g.strokeStyle=p.m;g.fillStyle=p.m;g.globalAlpha=.25+x.magic*.55;let ef=$('effect').value;if(ef==='runes'){for(let i=0;i<3+Math.floor(x.magic*5);i++)g.strokeRect(ri(r,s*.3,s*.7),ri(r,s*.22,s*.75),Math.max(2,s*.035),Math.max(2,s*.035))}else if(ef==='core'){g.beginPath();g.arc(s/2,s/2,s*(.04+.08*x.magic),0,Math.PI*2);g.fill()}else if(ef==='edge'){g.strokeRect(s*.19,s*.14,s*.62,s*.72)}else{g.beginPath();g.arc(s*.5,s*.43,s*(.035+.04*x.magic),0,Math.PI*2);g.fill()}g.restore()}
  $('meta').innerHTML=`<span class="pill">${types[cat][x.sub]}</span><span class="pill">${$('mainMat').value}</span><span class="pill">${s}×${s}px</span><span class="pill">${$('enchanted').checked?'Enchanted':'Normal'}</span>`;
}

function applyPreset(){
  const p=presets[$('preset').value];if(!p)return;
  ['dark','primary','secondary','highlight','accent','magicColor'].forEach((id,i)=>$(id).value=p[i]);
}

function randomize(){
  ['a','b','c','sym','detail','ornament','wear'].forEach(id=>{$(id).value=Math.floor(Math.random()*101);$(id).dispatchEvent(new Event('input'))});
  $('outline').value=Math.floor(Math.random()*4);$('outline').dispatchEvent(new Event('input'));
  $('subtype').selectedIndex=Math.floor(Math.random()*$('subtype').options.length);
  $('mainMat').selectedIndex=Math.floor(Math.random()*$('mainMat').options.length);$('accentMat').selectedIndex=Math.floor(Math.random()*$('accentMat').options.length);$('enchanted').checked=Math.random()>.55;$('magic').value=Math.floor(Math.random()*101);$('magic').dispatchEvent(new Event('input'));
  $('effect').selectedIndex=Math.floor(Math.random()*$('effect').options.length);salt++;render();
}

function exportPNG(scale){
  const out=document.createElement('canvas');out.width=C.width*scale;out.height=C.height*scale;
  const og=out.getContext('2d');og.imageSmoothingEnabled=false;og.drawImage(C,0,0,out.width,out.height);
  const a=document.createElement('a');a.download=`itemforge-${$('category').value}-${out.width}px.png`;a.href=out.toDataURL('image/png');a.click();
}

$('category').innerHTML=Object.keys(types).map(k=>`<option value="${k}">${k[0].toUpperCase()+k.slice(1)}</option>`).join('');
['a','b','c','sym','detail','ornament','wear','outline','magic'].forEach(id=>{
  const f=()=>{$(id+'V').textContent=$(id).value;if(typeof render==='function')render()};
  $(id).addEventListener('input',f);
  $(id+'V').textContent=$(id).value;
});
$('category').addEventListener('change',()=>{sync();render()});$('subtype').addEventListener('change',render);$('size').addEventListener('change',render);
$('preset').addEventListener('change',()=>{applyPreset();render()});['effect','mainMat','accentMat'].forEach(id=>$(id).addEventListener('change',render));
['enchanted','shadow'].forEach(id=>$(id).addEventListener('change',render));['dark','primary','secondary','highlight','accent','magicColor'].forEach(id=>$(id).addEventListener('input',render));
$('generate').addEventListener('click',render);$('reroll').addEventListener('click',()=>{salt++;render()});$('randomize').addEventListener('click',randomize);$('export').addEventListener('click',()=>exportPNG(1));$('export4').addEventListener('click',()=>exportPNG(4));
sync();render();
</script>
