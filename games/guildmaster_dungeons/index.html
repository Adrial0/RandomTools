<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Guildmaster: Dungeons — a party-building roguelike expedition.">
  <title>Guildmaster: Dungeons</title>
<link rel="stylesheet" href="styles.css?build=121">
<style>.skillTreeViewport .skillNode[onclick*="'junction-"]{--node-size:38px!important}.skillTreeViewport .skillNode[onclick*="'approach-"]{--node-size:52px!important}.skillTreeViewport .skillNode[onclick*="'route-"]{--node-size:52px!important}</style>
<style>.skillPointAlert{position:absolute;z-index:4;right:7px;top:7px;padding:4px 7px;border:1px solid #e3b04f;border-radius:12px;background:#52350d;color:#ffe29a;box-shadow:0 0 12px rgba(226,171,67,.55);font:bold 10px var(--mono)}.hero.subclassReady .skillPointAlert{top:39px}.abilityShrineRows{display:grid;gap:18px;margin-top:14px}.abilityShrineRow{padding:12px;border:1px solid #654a2d;background:#100d09}.abilityShrineRow header{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #594127}.abilityShrineRow h3{margin:2px 0 0;color:#f2cb7a}.abilityShrineChoices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.abilityShrineChoices .choice{min-height:120px}@media(max-width:700px){.abilityShrineChoices{grid-template-columns:1fr}}</style>
<style>.inventoryToolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0;padding:10px;border:1px solid #5d452b;background:#100d09}.inventoryToolbar label{display:flex;align-items:center;gap:8px;color:var(--mut_record);font:11px var(--mono)}.inventoryToolbar select{padding:8px 10px;border:1px solid #76542d;background:#0b0907;color:var(--ink);font:11px var(--mono)}@media(max-width:700px){.inventoryToolbar{align-items:stretch;flex-direction:column}.inventoryToolbar label{justify-content:space-between}.inventoryToolbar select{flex:1}}</style>
<style>.inventoryToolbar label{color:var(--muted)}</style>
<style>.hero .inspectHint{display:none}.draftAttributeGroups{gap:9px}.draftAttributeGroup{padding:8px}.draftAttributeGroup>header{margin-bottom:7px;padding-bottom:5px}.draftAttributeGroup .draftClassGrid{grid-template-columns:repeat(2,minmax(210px,1fr));gap:7px}.draftCandidate{padding:6px}.selectionHero{min-height:76px;padding:7px;grid-template-columns:48px 1fr}.selectionHero .portrait{width:48px;height:48px}.selectionHero .stats{margin-top:4px}@media(max-width:700px){.draftAttributeGroup .draftClassGrid{grid-template-columns:1fr}}</style>
<style>.mainChoiceField{min-height:calc(100dvh - 155px);display:grid;place-items:center;background-position:center;background-size:cover}.mainChoiceField:before{background:rgba(5,4,3,.48)}.mainChoiceWindow{position:relative;z-index:1;width:min(980px,95%);max-height:calc(100dvh - 195px);overflow:auto;padding:20px;background:rgba(15,11,7,.91);border:1px solid #79572e;box-shadow:0 12px 38px rgba(0,0,0,.7)}.unit.dodging .portrait{animation:dodgeFade .48s ease-out}.unit.dodging{animation:dodgeSlide .48s ease-out}@keyframes dodgeFade{35%{opacity:.25}100%{opacity:1}}@keyframes dodgeSlide{35%{transform:translateX(8px)}100%{transform:translateX(0)}}@media(max-width:700px){.mainChoiceField{min-height:calc(100dvh - 104px - env(safe-area-inset-bottom));padding:8px}.mainChoiceWindow{width:100%;max-height:calc(100dvh - 125px);padding:10px}}</style>
<style>.threeRailRun{grid-template-columns:84px 310px minmax(0,1fr);align-items:start;max-width:none}.threeRailRun>.combatField,.threeRailRun>.journeyStage{grid-column:3}.inventoryRail{position:relative;grid-column:1;padding:8px 6px;min-height:180px;overflow:visible}.inventoryRail h3{margin:0;text-align:center;font-size:13px}.inventoryRailCount{text-align:center;color:var(--muted);font:8px var(--mono);margin:2px 0 7px}.inventoryRailSlots{display:grid;grid-template-columns:repeat(2,32px);justify-content:center;gap:5px}.inventoryRailSlot{position:relative;width:32px;height:32px;padding:2px;border:1px solid #60492e;background:#0c0a07;cursor:pointer}.inventoryRailSlot:hover{z-index:30;border-color:#e0aa50;background:#2b1e10}.inventoryRailSlot .itemIcon{display:grid;float:none;width:26px;height:26px;place-items:center}.inventoryRailSlot .itemIcon img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated}.inventoryRailSlot .itemFallback{width:26px;height:26px;place-items:center}.inventoryRailTooltip{display:none;position:absolute;z-index:100;left:calc(100% + 8px);top:-8px;width:225px;padding:10px;text-align:left;border:1px solid #a57336;background:#120e09;box-shadow:5px 7px 18px #000;color:var(--ink);font:10px/1.4 var(--mono);pointer-events:none}.inventoryRailSlot:hover .inventoryRailTooltip{display:grid;gap:3px}.inventoryRailTooltip strong{font:15px var(--font)}.inventoryRailTooltip small,.inventoryRailTooltip em{color:var(--muted);font-style:normal}.inventoryRailOpen{display:block;width:68px;margin:8px auto 0;padding:3px;border:1px solid #60492e;background:#181109;color:var(--gold);cursor:pointer}.rarityBorder-Uncommon{border-color:#528247}.rarityBorder-Rare{border-color:#477da5}.rarityBorder-Epic{border-color:#8752a2}.rarityBorder-Legendary{border-color:#b47b2e}.rarityBorder-Mythic{border-color:#c84f72}@media(max-width:1050px){.threeRailRun{grid-template-columns:72px 260px minmax(0,1fr)}.inventoryRailSlots{grid-template-columns:repeat(2,28px)}.inventoryRailSlot{width:28px;height:28px}.inventoryRailSlot .itemIcon,.inventoryRailSlot .itemIcon img,.inventoryRailSlot .itemFallback{width:22px;height:22px}}@media(max-width:700px){.threeRailRun{display:block}.threeRailRun>.inventoryRail,.threeRailRun>aside{display:none}}</style>
<style>.runShell>.threeRailRun{grid-template-columns:84px 310px minmax(0,1fr)}@media(max-width:1050px){.runShell>.threeRailRun{grid-template-columns:72px 260px minmax(0,1fr)}}@media(max-width:700px){.runShell>.threeRailRun{display:block}}</style>
<style>.characterStatGroups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}.characterStatGroup{padding:9px;border:1px solid #59432b;background:#100d09}.characterStatGroup h4{margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid #433321;color:#e8c67f;font-size:13px}.characterStatGroup>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.groupedStat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 6px;border-left:2px solid #76542f;background:#18120c}.groupedStat small{color:var(--muted);font:9px var(--mono)}.groupedStat strong{color:#f3dfb5;font:11px var(--mono);white-space:nowrap}.statGroup-resources{border-color:#476b58}.statGroup-resources .groupedStat{border-left-color:#69a985}.statGroup-defense{border-color:#67523b}.statGroup-defense .groupedStat{border-left-color:#b48a55}.statGroup-offense{border-color:#74433b}.statGroup-offense .groupedStat{border-left-color:#c86d58}.statGroup-attributes{border-color:#585078}.statGroup-attributes .groupedStat{border-left-color:#9182cf}.statGroup-combat{border-color:#496174}.statGroup-combat .groupedStat{border-left-color:#6e9abb}@media(max-width:620px){.characterStatGroups{grid-template-columns:1fr}.characterStatGroup>div{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
</head>
<body>
  <header class="sitebar"><a href="/">MR/ My Random Tools</a><span>Guildmaster universe</span></header>
  <main id="app"></main>
  <div id="toast" aria-live="polite"></div>
<script src="game.js?build=140"></script>
</body>
</html>
